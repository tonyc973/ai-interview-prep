name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests construct settings explicitly, but these satisfy any import-time checks
  # and never reach OpenAI (the gateway is mocked in tests).
  APP_OPENAI_API_KEY: sk-ci-not-a-real-key
  APP_STORAGE_SECRET: ci-storage-secret-at-least-32-characters-long

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy app/ tests/

      - name: Tests + coverage gate
        run: uv run pytest --cov=app/services --cov=app/agents --cov=app/db --cov-fail-under=85

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-interview-prep:ci
