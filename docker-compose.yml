# Local run: `docker compose up --build`. Requires a populated .env
# (copy .env.example -> .env and set APP_OPENAI_API_KEY + APP_STORAGE_SECRET).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-interview-prep:latest
    env_file:
      - .env
    environment:
      # Container-internal SQLite path (persisted via the data volume below).
      APP_DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
