[project]
name = "ai-interview-prep"
version = "0.1.0"
description = "Production-grade AI Interview Preparation Platform (CrewAI + OpenAI + NiceGUI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "tonyc973" }]
license = { text = "MIT" }

dependencies = [
    # --- Agent orchestration & LLM provider ---
    "crewai>=1.14.6",
    "openai>=2.41.0",
    # --- Frontend ---
    "nicegui>=3.13.0",
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.50",
    "aiosqlite>=0.20.0",
    "alembic>=1.18.4",
    # --- Config & validation ---
    # Upper bounds dictated by crewai 1.14.6 (pydantic<2.13, pydantic-settings~=2.10.1)
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings>=2.10.1,<2.11",
    "email-validator>=2.2.0",
    # --- Security ---
    "argon2-cffi>=25.1.0",
    "zxcvbn>=4.5.0",
    # --- Reliability & logging ---
    "tenacity>=9.1.4",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ----------------------------------------------------------------------------
# Ruff: lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "ASYNC",            # async correctness
    "S",                # bandit (security)
    "RUF",              # ruff-specific
]
ignore = [
    "S101",   # asserts are fine in tests (further scoped below)
    "B008",   # function calls in defaults — NiceGUI/CrewAI idioms
    "N818",   # domain exceptions are named by meaning (InvalidCredentials, CostLimitExceeded)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/db/migrations/**" = ["ALL"]
"app/ui/**" = ["SIM117"]  # nested `with` is idiomatic NiceGUI layout; combining hurts readability
"app/ui/theme.py" = ["SIM117", "E501"]  # long lines inside the CSS string literal

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# mypy: strict on our code; third-party libs without stubs are ignored
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ['app/db/migrations/']

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "nicegui.*",
    "zxcvbn.*",
    "alembic.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ImportWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "smoke: real OpenAI calls (opt-in, never in CI)",
]

# ----------------------------------------------------------------------------
# Coverage: gate on the business-logic layers, exclude prompt text
# ----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app/services", "app/agents", "app/db"]
omit = [
    "app/agents/prompts.py",
    "app/db/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
